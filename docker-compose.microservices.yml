x-dorknet-service-env: &dorknet-service-env
  DORKNET_DOMAIN: ${DORKNET_DOMAIN:-localhost}
  DORKNET_JWT_SECRET: ${DORKNET_JWT_SECRET:-dorknet-dev-jwt-secret-000000000000000000000000000000000000000000}
  Database__Provider: postgres
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=dorknet;Username=dorknet;Password=${POSTGRES_PASSWORD:-dorknet_dev}
  ConnectionStrings__Redis: redis:6379
  S3__Endpoint: ${DORKNET_S3_ENDPOINT:-}
  S3__AccessKey: ${DORKNET_S3_ACCESS_KEY:-}
  S3__SecretKey: ${DORKNET_S3_SECRET_KEY:-}
  S3__Region: ${DORKNET_S3_REGION:-garage}

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Gateway/DorkNet.Gateway.csproj
        APP_DLL: DorkNet.Gateway.dll
    environment:
      DORKNET_DOMAIN: ${DORKNET_DOMAIN:-localhost}
      DorkNet__Services__Identity: http://identity:8080
      DorkNet__Services__Rooms: http://rooms:8080
      DorkNet__Services__Notify: http://notify:8080
      DorkNet__Services__Content: http://content:8080
      DorkNet__Services__Social: http://social:8080
      DorkNet__Services__Commerce: http://commerce:8080
      DorkNet__Services__Platform: http://platform:8080
      DorkNet__Services__Moderation: http://moderation:8080
      DorkNet__Services__Web: http://web:8080
      DorkNet__Services__Monolith: http://monolith:8080
    ports:
      - "8080:8080"
    depends_on:
      - identity
      - rooms
      - notify
      - content
      - social
      - commerce
      - platform
      - moderation
      - web
      - monolith

  identity:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Services.Identity/DorkNet.Services.Identity.csproj
        APP_DLL: DorkNet.Services.Identity.dll
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  rooms:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Services.Rooms/DorkNet.Services.Rooms.csproj
        APP_DLL: DorkNet.Services.Rooms.dll
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  notify:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Services.Notify/DorkNet.Services.Notify.csproj
        APP_DLL: DorkNet.Services.Notify.dll
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  content:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Services.Content/DorkNet.Services.Content.csproj
        APP_DLL: DorkNet.Services.Content.dll
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  social:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Services.Social/DorkNet.Services.Social.csproj
        APP_DLL: DorkNet.Services.Social.dll
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  commerce:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Services.Commerce/DorkNet.Services.Commerce.csproj
        APP_DLL: DorkNet.Services.Commerce.dll
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  platform:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Services.Platform/DorkNet.Services.Platform.csproj
        APP_DLL: DorkNet.Services.Platform.dll
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  moderation:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Services.Moderation/DorkNet.Services.Moderation.csproj
        APP_DLL: DorkNet.Services.Moderation.dll
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: DorkNet.Services.Web/DorkNet.Services.Web.csproj
        APP_DLL: DorkNet.Services.Web.dll
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  monolith:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *dorknet-service-env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dorknet
      POSTGRES_USER: dorknet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorknet_dev}
    volumes:
      - microservices-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  microservices-postgres:
